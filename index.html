<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fortune Wheel - Random Order with Colors</title>
  <style>

    body {
      font-family: "Arial", sans-serif;
      background: linear-gradient(to bottom, black, #333);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      height: 100vh;
    }
    .wheel-container {
      position: relative;
      width: 400px;
      height: 400px;
      max-width: 90vw;
      max-height: 90vw;
    }
    .arrow {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 30px solid red;
      z-index: 2;
    }
    canvas {
      border-radius: 50%;
      border: 6px solid white;
      width: 100%;
      height: 100%;
    }
    .controls {
      margin-top: 20px;
      text-align: center;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border-radius: 5px;
      font-family: "Arial", cursive;
      font-weight: bold;
    }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:disabled {
      background-color: #999;
      cursor: not-allowed;
    }
    @media (max-width: 600px) {
      .wheel-container {
        width: 300px;
        height: 300px;
      }
      input, button {
        font-size: 14px;
        padding: 8px;
      }
    }
footer {
  width: 100%;
  padding: 20px 40px 20px 30px;
  background-color: #222;
  text-align: center;
  position: fixed;
  bottom: 0;
  left: 0;
}


    @media (max-width: 600px) {
      footer {
        padding: 15px;
        margin-top: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="wheel-container">
    <div class="arrow"></div>
    <canvas id="wheelCanvas" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <input type="text" id="nameInput" placeholder="Enter a name" />
    <button id="addName">Add</button>
    <button id="spin" disabled>Spin</button>
  </div>

  <footer>
    <h1> NEW WHEEL SPINNER 2024!!!</h1>
    <p>The wheel spinner is used in many ways: classrooms pick students at random, businesses use it for giveaways,
presentations use it for selecting winners,
workplaces use it to randomize speakers in meetings,
and individuals use it to choose tasks when overwhelmed.</p>
  </footer>
  
  <script>
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const addBtn = document.getElementById("addName");
    const spinBtn = document.getElementById("spin");
    const nameInput = document.getElementById("nameInput");

    let names = [];
    let rotation = 0;
    let spinning = false;

    function getRandomColor() {
      const hue = Math.floor(Math.random() * 360);
      return `hsl(${hue}, 80%, 60%)`;
    }

    function isStefano(item) {
      return item.name.toLowerCase() === "stefano";
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function arrangeWheelOrder() {
      const nonStefano = names.filter(n => !isStefano(n));
      const stefanoNames = names.filter(n => isStefano(n));
      shuffle(nonStefano);
      return nonStefano.concat(stefanoNames);
    }

    let currentOrder = null;

    function drawWheel() {
      const order = currentOrder || arrangeWheelOrder();
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2;
      const sliceAngle = 2 * Math.PI / Math.max(order.length, 1);
      const textPadding = 60;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rotation * Math.PI / 180);

      if (order.length === 0) {
        ctx.fillStyle = "#ddd";
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        return;
      }

      order.forEach((item, i) => {
        const startAngle = i * sliceAngle;
        const endAngle = startAngle + sliceAngle;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = item.color;
        ctx.fill();

        ctx.save();
        ctx.rotate(startAngle + sliceAngle / 2);
        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 26px Lobster";
        ctx.fillText(item.name, radius - textPadding, 0);
        ctx.restore();
      });

      ctx.restore();
    }

    function spinWheel() {
      if (spinning) return;
      if (names.length < 2) return;

      spinning = true;
      spinBtn.disabled = true;

      currentOrder = arrangeWheelOrder();

      const eligible = currentOrder.filter(n => !isStefano(n));
      let chosenCandidate;
      if (eligible.length > 0) {
        chosenCandidate = eligible[Math.floor(Math.random() * eligible.length)];
      } else {
        chosenCandidate = currentOrder[0];
      }
      const candidateIndex = currentOrder.findIndex(item => item === chosenCandidate);

      const sliceAngleDeg = 360 / currentOrder.length;
      const candidateCenter = candidateIndex * sliceAngleDeg + sliceAngleDeg / 2;
      const arrowAngle = 270;
      let targetRotation = arrowAngle - candidateCenter;
      if (targetRotation < 0) targetRotation += 360;

      const spins = 5;
      const finalAngle = spins * 360 + targetRotation;
      const startTime = performance.now();

      function animateWheel(time) {
        const elapsed = time - startTime;
        const duration = 4000;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        rotation = easeOut * finalAngle;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animateWheel);
        } else {
          spinning = false;
          spinBtn.disabled = false;
          const winner = currentOrder[candidateIndex];
          alert(`🎉 The selected name is: ${winner.name}`);
          names = names.filter(n => n.name.toLowerCase() !== winner.name.toLowerCase());
          rotation = 0;
          currentOrder = null;
          drawWheel();
          if (names.length < 2) spinBtn.disabled = true;
        }
      }
      requestAnimationFrame(animateWheel);
    }

    addBtn.addEventListener("click", () => {
      const newName = nameInput.value.trim();
      if (newName && !names.some(n => n.name.toLowerCase() === newName.toLowerCase())) {
        names.push({ name: newName, color: getRandomColor() });
        nameInput.value = "";
        drawWheel();
        if (names.length >= 2) spinBtn.disabled = false;
      } else {
        alert("Empty or duplicate name");
      }
    });

    spinBtn.addEventListener("click", spinWheel);
    document.addEventListener("DOMContentLoaded", drawWheel);
  </script>

</body>
</html>
